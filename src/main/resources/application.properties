spring.application.name=gyeongjuma_be

spring.profiles.include=secret

# === DB ?? (???? ?? ??? ????) ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_ID}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 커넥션 풀 (HikariCP)
# leak-detection-threshold: 커넥션을 20초 넘게 붙잡고 있으면 스택트레이스를 로그로 남긴다.
#   누수 지점을 바로 찾을 수 있으므로 개발 중에는 켜 둘 것.
# connection-timeout: 풀이 고갈됐을 때 무한 대기하지 않고 10초 만에 실패시킨다.
# max-lifetime: MySQL wait_timeout보다 짧게 잡아 끊긴 커넥션 재사용을 막는다.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=20000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# === CORS 설정 ===
# 배포 서버는 환경변수 CORS_ALLOWED_HOST로 주입. 쉼표로 여러 오리진 지정 가능.
cors.allowed.host=${CORS_ALLOWED_HOST:http://localhost:5173,http://localhost:3000}

# === 리프레시 토큰 쿠키 ===
# 로컬 개발(http): secure=false, Lax
# 배포(https)    : secure=true 필수
#   - 프론트/백엔드가 같은 상위 도메인(www.x.com / api.x.com) → same-site=Lax
#   - 완전히 다른 도메인(Vercel + 별도 API 서버)             → same-site=None
app.cookie.refresh.secure=${COOKIE_SECURE:false}
app.cookie.refresh.same-site=${COOKIE_SAME_SITE:Lax}

# === JWT 설정 ===
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-ms=3600000
jwt.refresh-token-validity-ms=1209600000

# === Google OAuth ===
oauth.google.client-id=${GOOGLE_CLIENT_ID}
