spring.application.name=gyeongjuma_be

spring.profiles.include=secret

# === DB ?? (???? ?? ??? ????) ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_ID}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# === CORS ?? ===
cors.allowed.host=${CORS_ALLOWED_HOST}

# === JWT ?? ===
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-ms=3600000
jwt.refresh-token-validity-ms=1209600000

# === Google OAuth ===
oauth.google.client-id=${GOOGLE_CLIENT_ID}

