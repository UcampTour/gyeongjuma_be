spring.application.name=gyeongjuma_be

spring.profiles.include=secret

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 커넥션 풀 (HikariCP)
# leak-detection-threshold: 커넥션을 20초 넘게 붙잡고 있으면 스택트레이스를 로그로 남긴다.
#   누수 지점을 바로 찾을 수 있으므로 개발 중에는 켜 둘 것.
# connection-timeout: 풀이 고갈됐을 때 무한 대기하지 않고 10초 만에 실패시킨다.
# max-lifetime: MySQL wait_timeout보다 짧게 잡아 끊긴 커넥션 재사용을 막는다.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=20000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS 허용 오리진 (쉼표로 구분). 배포 시 실제 프론트 주소를 추가할 것
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# 리프레시 토큰 쿠키 설정
# 로컬 개발(http)에서는 secure=false, Lax
# 배포(https) 시  : secure=true
#   - 프론트/백엔드가 같은 상위 도메인(www.x.com / api.x.com) → same-site=Lax
#   - 완전히 다른 도메인                                      → same-site=None (iOS 사파리에서 차단될 수 있음)
app.cookie.refresh.secure=false
app.cookie.refresh.same-site=Lax